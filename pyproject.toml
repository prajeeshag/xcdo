[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name = "xcdo"
dynamic = ["version"]
description = ""
authors = [{ name = "Prajeesh Ag", email = "prajeeshag@gmail.com" }]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cartopy>=0.24.1",
    "cfgrib>=0.9.14.1",
    "cftime>=1.6.4.post1",
    "clios>=0.2.1",
    "dask[array,distributed]>=2024.11.2",
    "eccodes>=2.39.0",
    "matplotlib>=3.9.2",
    "nc-time-axis>=1.4.1",
    "netcdf4>=1.7.2",
    "numpy>=2.1.3",
    "seaborn>=0.13.2",
    "xarray>=2024.11",
    "zarr>=2.18.3",
]

[project.scripts]
# xcdo = "xcdo:app"

[project.urls]
homepage = "https://prajeeshag.github.io/xcdo"
repository = "https://github.com/prajeeshag/xcdo"
documentation = "https://prajeeshag.github.io/xcdo"

[tool.pdm.build]
excludes = ["tests", "docs", "examples"]

[tool.pdm.version]
source = "scm"

[tool.pytest.ini_options]
testpaths = ["tests", "examples"]

[tool.commitizen]
name = "cz_gitmoji"

[tool.uv]
default-groups = ["dev", "docs"]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest_mock",
    "pytest-sugar",
    "pytest-cov",
    "mypy>=1.13.0",
    "cdo>=1.6.1",
]
docs = ["mkdocs", "mkdocs-material"]

[tool.coverage.run]
branch = true
source = ["xcdo"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.mypy]
strict = true
