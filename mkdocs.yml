site_name: XCDO
site_description: A collection of command line Operators to manipulate and analyse Climate and NWP model Data.
repo_name: prajeeshag/xcdo
repo_url: https://github.com/prajeeshag/xcdo
theme:
  name: material

nav:
  - XCDO: index.md
  - User Guide: user_guide.md

plugins:
  - termynal:
      prompt_literal_start:
        - "$"
        - "(xcdo)$"
        - "(.venv)$"

markdown_extensions:
  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true

  # Python Markdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
